<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuickQuote</title>
<style>
*{box-sizing:border-box}body{font:18px system-ui;background:#eef3f6;color:#152b38;margin:0}main{max-width:850px;margin:auto;padding:24px}section{background:white;padding:24px;margin:20px 0;border-radius:16px}h1{margin-bottom:4px}label{display:block;margin:16px 0 6px}input,textarea,select,button{font:inherit;padding:12px;border:1px solid #b8c8d0;border-radius:8px;width:100%}textarea{min-height:100px}button{background:#116b65;color:white;cursor:pointer;margin-top:12px}button.secondary{background:#edf3f3;color:#152b38}.row{display:flex;gap:16px}.row>*{flex:1;min-width:0}pre{white-space:pre-wrap;font:inherit;line-height:1.6}#status{min-height:28px}small{color:#48616f}@media(max-width:550px){.row{display:block}}@media print{body{background:white}main{padding:0}main>*:not(#preview){display:none}#preview{margin:0;padding:0}#preview button{display:none}}
</style>
<main><h1>QuickQuote</h1><small>Clients and quotes are saved in this browser. Download a backup regularly.</small><p id="status" role="status"></p>
<section><h2>Client address book</h2><label for="clients">Saved clients</label><select id="clients"><option value="">Choose a client</option></select><label for="customer">Customer name</label><input id="customer" autocomplete="name"><label for="address">Job address</label><input id="address" autocomplete="street-address"><div class="row"><button id="saveClient">Save client</button><button class="secondary" id="deleteClient">Delete selected client</button></div></section>
<section><h2>New quote</h2><label for="job">Job description</label><textarea id="job"></textarea><div class="row"><div><label for="materials">Materials ($)</label><input id="materials" type="number" min="0" step="0.01" value="0"></div><div><label for="labour">Labour ($)</label><input id="labour" type="number" min="0" step="0.01" value="0"></div></div><button id="create">Create and save quote</button></section>
<section><h2>Saved quotes</h2><label for="quotes">Choose a quote</label><select id="quotes"><option value="">Choose a quote</option></select><button class="secondary" id="deleteQuote">Delete selected quote</button></section>
<section id="preview"><h2>Quote</h2><pre id="output">Your quote will appear here.</pre><div class="row"><button id="copy">Copy quote</button><button id="print">Print / Save PDF</button></div></section>
<section><h2>Backup</h2><button id="backup">Download backup</button><label for="restore">Restore backup (adds missing records)</label><input id="restore" type="file" accept="application/json,.json"></section></main>
<script>
'use strict';
const $=id=>document.getElementById(id), key='quickquote-code-v1';
let data={clients:[],quotes:[]}, selectedQuote='';
const message=s=>$('status').textContent=s;
const valid=d=>d&&Array.isArray(d.clients)&&Array.isArray(d.quotes)&&d.clients.every(c=>c&&typeof c.id==='string'&&typeof c.name==='string'&&typeof c.address==='string')&&d.quotes.every(q=>q&&typeof q.id==='string'&&typeof q.name==='string'&&typeof q.address==='string'&&typeof q.job==='string'&&typeof q.date==='string'&&Number.isSafeInteger(q.materials)&&q.materials>=0&&Number.isSafeInteger(q.labour)&&q.labour>=0&&Number.isSafeInteger(q.materials+q.labour));
try{const saved=localStorage.getItem(key);if(saved){const parsed=JSON.parse(saved);if(!valid(parsed))throw Error();data=parsed;}}catch(e){message('Saved data could not be loaded. Restore a backup before saving new records.');}
function persist(next){try{localStorage.setItem(key,JSON.stringify(next));data=next;return true;}catch(e){message('Could not save. Check browser storage and download a backup.');return false;}}
const uid=()=>Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
function options(id,items,label){const sel=$(id),old=sel.value;sel.replaceChildren(new Option(id==='clients'?'Choose a client':'Choose a quote',''));items.forEach(x=>sel.add(new Option(label(x),x.id)));if(items.some(x=>x.id===old))sel.value=old;}
function refresh(){options('clients',data.clients,c=>c.name+' — '+c.address);options('quotes',data.quotes,q=>q.name+' — '+q.job+' — '+money(q.materials+q.labour));}
const money=c=>new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(c/100);
function quoteText(q){return 'QUICK QUOTE\nDate: '+q.date+'\nCustomer: '+q.name+'\nJob address: '+q.address+'\n\n'+q.job+'\n\nMaterials: '+money(q.materials)+'\nLabour: '+money(q.labour)+'\nTotal: '+money(q.materials+q.labour);}
$('clients').onchange=()=>{const c=data.clients.find(c=>c.id===$('clients').value);if(c){$('customer').value=c.name;$('address').value=c.address;}};
$('saveClient').onclick=()=>{const name=$('customer').value.trim(),address=$('address').value.trim();if(!name)return message('Enter a customer name first.');const id=$('clients').value||uid(),clients=data.clients.filter(c=>c.id!==id).concat({id,name,address});if(persist({...data,clients})){refresh();$('clients').value=id;message('Client saved.');}};
$('deleteClient').onclick=()=>{const id=$('clients').value;if(!id)return message('Choose a saved client first.');if(confirm('Delete this client from the address book? Saved quotes will remain.'))if(persist({...data,clients:data.clients.filter(c=>c.id!==id)})){refresh();message('Client deleted.');}};
function cents(id){const raw=$(id).value.trim();if(!/^\d+(\.\d{1,2})?$/.test(raw))throw Error('Enter a nonnegative cost with no more than two decimal places.');const n=Math.round(Number(raw)*100);if(!Number.isSafeInteger(n))throw Error('Cost is too large.');return n;}
$('create').onclick=()=>{try{const name=$('customer').value.trim(),address=$('address').value.trim(),job=$('job').value.trim();if(!name||!job)return message('Enter a customer name and job description.');const q={id:uid(),date:new Date().toLocaleDateString('en-CA'),name,address,job,materials:cents('materials'),labour:cents('labour')};if(!Number.isSafeInteger(q.materials+q.labour))throw Error('Total is too large.');if(persist({...data,quotes:[q,...data.quotes]})){refresh();$('quotes').value=q.id;selectedQuote=q.id;$('output').textContent=quoteText(q);message('Quote saved.');}}catch(e){message(e.message);}};
$('quotes').onchange=()=>{selectedQuote=$('quotes').value;const q=data.quotes.find(q=>q.id===selectedQuote);$('output').textContent=q?quoteText(q):'Your quote will appear here.';};
$('deleteQuote').onclick=()=>{const id=$('quotes').value;if(!id)return message('Choose a quote first.');if(confirm('Delete this saved quote?'))if(persist({...data,quotes:data.quotes.filter(q=>q.id!==id)})){refresh();if(selectedQuote===id){selectedQuote='';$('output').textContent='Your quote will appear here.';}message('Quote deleted.');}};
$('copy').onclick=async()=>{if(!selectedQuote)return message('Create or choose a quote first.');try{await navigator.clipboard.writeText($('output').textContent);message('Quote copied.');}catch(e){message('Select the quote text and press Ctrl+C to copy.');}};
$('print').onclick=()=>{if(!selectedQuote)return message('Create or choose a quote first.');window.print();};
$('backup').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='QuickQuote-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$('restore').onchange=async()=>{try{const file=$('restore').files[0];if(!file)return;const incoming=JSON.parse(await file.text());if(!valid(incoming))throw Error();const merge=(a,b)=>{const seen=new Set(a.map(x=>x.id));return a.concat(b.filter(x=>{if(seen.has(x.id))return false;seen.add(x.id);return true;}));};if(persist({clients:merge(data.clients,incoming.clients),quotes:merge(data.quotes,incoming.quotes)})){refresh();message('Backup restored.');}}catch(e){message('This file is not a valid QuickQuote backup.');}$('restore').value='';};
refresh();
</script></html>
